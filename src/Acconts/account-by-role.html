<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width: 100%;
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
        }
        img{
            width: 50px;
            height: 50px;
            object-fit: cover;
        }

    </style>
</head>
<body>
       <div>
    <h1>Account by Role</h1>    
      <table>
        <thead>
            <tr>
                <td>Name</td>
                <td>Email</td>
                <td>ContactNo</td>
                <td>Profile Pic</td>
                <td>Action</td>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table> 
      <div id="errorDiv"></div>  
    </div>

    <script>
        // Http Verbs
        //  1) GET      Read
        //  2) POST     create
        //  3) PUT      Update
        //  4) DELETE   Delete

        // CREATE READ UPDATE DELETE   => CRUD  
            const baseUrl='https://trekdekashmirapi.logichubss.com/';
           
           
           async  function loadAccountsInfomations() {

            try{
                let x=10;
                let y=Number(prompt('Enter a number to divide 10'));
                if(x <=0){
                    throw new Error('X cannot be less than or equal to zero');
                }
                if(y===0){
                    throw new Error('Y cannot be zero');
                }
                let z= x/y;
                console.log('z value is ',z);
              
                const response=  await fetch(baseUrl+'api/accounts/by-role?userRole=2', {
                                    method:'GET'
                                });
            
                     const accounts=   await response.json();  
                   
                    let tbody = document.getElementById('tbody');
                    if(accounts.isSuccess){
                     
                     accounts.result.forEach(account => {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                        <td>${account.name}</td>
                        <td>${account.email}</td>
                        <td>${account.contactNo}</td>
                         <td>
                            <a href="details.html?${account.id}">View Details</a>
                            </td>
                                <td>
                                    <img src="${baseUrl}${account.filePath}" alt="" >
                                    </td>
                                <td><a href="details.html?id=${account.id}">Details</a></td>
                                <td><a href="address/addresses.html?id=${account.id}">Address</a></td>
                        `;
                        tbody.appendChild(tr);
                  
                    })
                    } else {
                        tbody.innerHTML = '<tr><td colspan="5">No accounts found</td></tr>';
                    }
            }catch(error){
                // console.error('Message: ', error.message);
                // console.error('Trace: ', error.trace);
                document.querySelector('#errorDiv').innerHTML = '<p style="color:red;">An error occurred while loading account information. Please try again later. our team is working on the issue if you have further query please contact helpdesk</p>';
                 console.error('Error thrown here :',error);
                 // log
                //  LogError(error);
            }
            finally{
                console.log('Execution completed');
            }
        }

            loadAccountsInfomations();

    </script>   
</body>
</html>
