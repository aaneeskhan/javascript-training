<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width: 100%;
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
        }
        img{
            width: 50px;
            height: 50px;
            object-fit: cover;
        }

    </style>
</head>
<body>
       <div>
    <h1>Account by Role</h1>    
      <table>
        <thead>
            <tr>
                <td>Name</td>
                <td>Email</td>
                <td>ContactNo</td>
                <td>Profile Pic</td>
            </tr>
        </thead>
        <tbody id="tbody">
            <td>
                
            </td>
        </tbody>
      </table>   
    </div>

    <script>
            const baseUrl='https://trekdekashmirapi.logichubss.com/';
            function loadAccountsInfomations() {
              fetch(baseUrl+'api/accounts/by-role?userRole=1', {
                    method:'GET'
                }).then(response=>{
                    return response.json();
                }).then(data=>{
                    console.log(data);
                    let tbody = document.getElementById('tbody');
                    if(data.isSuccess){
                        const accountList=   data.result;
                        console.log(accountList);
                     accountList.forEach(account => {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                        <td>${account.name}</td>
                        <td>${account.email}</td>
                        <td>${account.contactNo}</td>
                        <td>
                            <img src="${baseUrl}${account.filePath}" alt="" >
                            </td>
                            <td><a href="details.html?${account.id}">View Details</a></td>
                            // <td><a href="${baseUrl}api/accounts/search/${account.name}">View name</a></td>
                        `;
                        tbody.appendChild(tr);
                    });
                    }
                  
                })
            }

            loadAccountsInfomations();

    </script>   
</body>
</html>
