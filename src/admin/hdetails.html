<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Details Form</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
}

.form-container {
  width: 400px;
  margin: 40px auto;
  border: 1px solid black;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 15px;
  display: flex;
  flex-direction: column;
}

label {
  margin-bottom: 5px;
}

input, select {
  padding: 6px;
  border: 1px solid black;
}

#p {
  margin-bottom: 15px;
  display: flex;
  flex-direction: column;
}

#pfp {
  width: 100px;
  height: 100px;
  border: 1px solid black;
  object-fit: cover;
}

button {
  padding: 8px 12px;
  margin-right: 5px;
  border: 1px solid black;
  background: none;
  cursor: pointer;
}
</style>

</head>

<body>
<div class="form-container">
  <h2>Hotel Details</h2>
  <form>
    <div class="form-group">
      <label for="id">ID</label>
      <input type="text" id="id" readonly>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <input type="text" id="description" readonly>
    </div>

    <div class="form-group">
      <label for="addressId">Address ID</label>
      <input type="text" id="addressId" readonly>
    </div>

    <div class="form-group">
      <label for="landmark">Landmark</label>
      <input type="text" id="landmark" readonly>
    </div>

    <div class="form-group">
      <label for="pincode">Pincode</label>
      <input type="number" id="pincode" readonly>
    </div>

    <div class="form-group">
      <label for="addressLine">Address Line</label>
      <input type="text" id="addressLine" readonly>
    </div>

    <div id="p">
      <label for="pfp">Profile</label>
      <img id="pfp" src="" alt="">
    </div>

    <div class="form-group">
      <select id="isVideo" disabled>
        <option value="true">True</option>
        <option value="false">False</option>
      </select>
    </div>

    <div class="form-group">
      <label for="createdOn">Created On</label>
      <input type="text" id="createdOn" readonly>
    </div>
  </form>

  <button id="edit">Edit</button>
  <button id="del">Delete</button>
</div>

<script src="../services/hotel/hdetails.js"></script>
</body>
</html>
