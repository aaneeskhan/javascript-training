<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Hotel Details</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
}

.form-container {
  width: 400px;
  margin: 40px auto;
  border: 1px solid black;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

form div {
  margin-bottom: 15px;
  display: flex;
  flex-direction: column;
}

label {
  margin-bottom: 5px;
}

input, textarea {
  padding: 6px;
  border: 1px solid black;
}

textarea {
  resize: vertical;
  min-height: 60px;
}

button {
  padding: 8px;
  border: 1px solid black;
  background: none;
  cursor: pointer;
}

#msg {
  margin-top: 10px;
}
</style>

</head>

<body>
<div class="form-container">
  <h2>Edit Hotel Details</h2>
  
  <form id="addressForm">
    <div>
      <label for="id">File</label>
      <input type="text" name="id" id="id" readonly style="background-color: rgb(87, 86, 86); color: beige;">
    </div>
    
    <div>
      <label for="name">Name</label>
      <input type="text" name="name" id="name" required>
    </div>

    <div>
      <label for="star">Star</label>
      <input type="number" name="star" id="star" min="1" max="7" required>
    </div>

    <div>
      <label for="description">Description</label>
      <textarea name="description" id="description" required></textarea>
    </div>
 
    <button type="submit">Submit</button>
    <p id="msg"></p>
  </form>
</div>

<script src="../services/hotel/hedit.js"></script>
</body>
</html>
